apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: https-longhorn
  hostnames:
    - longhorn.lab.chxmxii.xyz
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
            remove:
              - Server
              - X-Powered-By
---
# longhorn has no OIDC support of its own: the gateway logs users in against Keycloak
# and only lets members of the k8s-admins group through.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-sso
  namespace: longhorn-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn
  oidc:
    provider:
      issuer: https://keycloak.lab.chxmxii.xyz/realms/kubegoros
    clientID: edge-proxy
    clientSecret:
      name: edge-oidc
    scopes: [openid, profile, email, groups]
    redirectURL: https://longhorn.lab.chxmxii.xyz/oauth2/callback
    logoutPath: /oauth2/logout
    forwardIDToken:
      header: X-Kubegoros-Id-Token
  jwt:
    providers:
      - name: keycloak
        issuer: https://keycloak.lab.chxmxii.xyz/realms/kubegoros
        audiences: [edge-proxy]
        remoteJWKS:
          uri: https://keycloak.lab.chxmxii.xyz/realms/kubegoros/protocol/openid-connect/certs
        extractFrom:
          headers:
            - name: X-Kubegoros-Id-Token
  authorization:
    defaultAction: Deny
    rules:
      - name: platform-admins
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: groups
                valueType: StringArray
                values: [k8s-admins]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: edge-oidc
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: edge-oidc
  data:
    - secretKey: client-secret
      remoteRef:
        key: keycloak-clients
        property: edge-proxy
