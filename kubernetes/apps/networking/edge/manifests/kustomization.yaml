apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
resources:
  - gateway.yaml
  - policies.yaml
  - routes/argocd.yaml
  - routes/grafana.yaml
  - routes/prometheus.yaml
  - routes/alertmanager.yaml
  - routes/longhorn.yaml
  - routes/hubble.yaml
  - routes/keycloak.yaml
  - routes/headlamp.yaml
