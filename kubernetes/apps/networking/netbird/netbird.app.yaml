apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: netbird
    server: https://kubernetes.default.svc
  project: networking
  source:
    path: kubernetes/apps/networking/netbird/chart
    repoURL: https://github.com/chxmxii/kubegoros.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
