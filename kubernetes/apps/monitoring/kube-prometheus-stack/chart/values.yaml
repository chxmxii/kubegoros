# namespace: monitoring
namespaceOverride: monitoring


cleanPrometheusOperatorObjectNames: true

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 2
    useExistingSecret: true
    configSecret: alertmanager-config
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  # Exposed through the edge Gateway (kubernetes/apps/networking/edge), behind Keycloak SSO
  ingress:
    enabled: false

nodeExporter:
  enabled: true

kubelet:
  enabled: true
  serviceMonitor:
    metricRelabelings:
      # Drop high cardinality labels
      - action: labeldrop
        regex: (uid)
      - action: labeldrop
        regex: (id|name)
      - action: drop
        sourceLabels: ["__name__"]
        regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
      - action: drop
        sourceLabels: ["__name__"]
        regex: (apiserver|etcd)_request(|_sli|_slo)_duration_seconds_bucket
      - action: drop
        sourceLabels: ["__name__"]
        regex: apiserver_request_body_size_bytes_bucket
      - action: drop
        sourceLabels: ["__name__"]
        regex: apiserver_(response|watch_events)_sizes_bucket
      - action: drop
        sourceLabels: ["__name__"]
        regex: (kubelet_runtime_operations|storage_operation)_duration_seconds_bucket
      - action: drop
        sourceLabels: ["__name__"]
        regex: (apiserver|etcd)_request_total
      - action: drop
        sourceLabels: ["__name__"]
        regex: (etcd|apiserver)_request_duration_seconds_(count|sum)
    probesMetricRelabelings:
      - action: drop
        sourceLabels: ["__name__"]
        regex: prober_probe_duration_seconds_bucket
    cAdvisorMetricRelabelings:
      - action: labeldrop
        regex: (uid)
      - action: labeldrop
        regex: (id|name)
      - action: labeldrop
        regex: (endpoint|instance)

kubeApiServer:
  enabled: true
  serviceMonitor:
    metricRelabelings:
      # Drop high cardinality labels
      - action: drop
        sourceLabels: ["__name__"]
        regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
      - action: drop
        sourceLabels: ["__name__"]
        regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket)
      - action: drop
        sourceLabels: ["__name__"]
        regex: apiserver_request_body_size_bytes_bucket
      - action: drop
        sourceLabels: ["__name__"]
        regex: workqueue_(queue|work)_duration_seconds_bucket
      - action: drop
        sourceLabels: ["__name__"]
        regex: apiserver_admission_controller_admission_duration_seconds_bucket

kubeEtcd:
  enabled: true
  # endpoints:
  #   - 10.254.100.10
  #   - 10.254.100.11
  #   - 10.254.100.15
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: ["__name__"]
        regex: (etcd_request_duration_seconds_bucket)

kubeControllerManager:
  enabled: true
  # endpoints:
  #   - 10.254.100.10
  #   - 10.254.100.11
  #   - 10.254.100.15

# kube-proxy is replaced by Cilium (kubeProxyReplacement)
kubeProxy:
  enabled: false
  # endpoints:
  #   - 10.254.100.10
  #   - 10.254.100.11
  #   - 10.254.100.15

kubeScheduler:
  enabled: true
  # endpoints:
  #   - 10.254.100.10
  #   - 10.254.100.11
  #   - 10.254.100.15

defaultRules:
  rules:
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

grafana:
  enabled: true
  replicas: 1

  # Login through Keycloak (realm kubegoros, client "grafana").
  # Group -> role: k8s-admins = Admin, k8s-viewers = Viewer, anyone else is refused.
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret

  grafana.ini:
    server:
      root_url: https://grafana.lab.chxmxii.xyz
    auth:
      oauth_auto_login: true
      disable_login_form: true
    auth.basic:
      enabled: false
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      icon: signin
      client_id: grafana
      scopes: openid profile email groups
      empty_scopes: false
      auth_url: https://keycloak.lab.chxmxii.xyz/realms/kubegoros/protocol/openid-connect/auth
      token_url: https://keycloak.lab.chxmxii.xyz/realms/kubegoros/protocol/openid-connect/token
      api_url: https://keycloak.lab.chxmxii.xyz/realms/kubegoros/protocol/openid-connect/userinfo
      signout_redirect_url: https://keycloak.lab.chxmxii.xyz/realms/kubegoros/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.lab.chxmxii.xyz%2Flogin
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      groups_attribute_path: groups
      role_attribute_path: contains(groups[*], 'k8s-admins') && 'Admin' || contains(groups[*], 'k8s-viewers') && 'Viewer'
      role_attribute_strict: true
      allow_assign_grafana_admin: true
      use_pkce: true
    users:
      allow_sign_up: false
      auto_assign_org_role: Viewer
    security:
      cookie_secure: true
      disable_gravatar: true

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi

  # Exposed through the edge Gateway (kubernetes/apps/networking/edge)
  ingress:
    enabled: false

  # defaultDashboardsEditable: false


  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.logging.svc.cluster.local
      jsonData:
        maxLines: 1000

prometheus:
  # Exposed through the edge Gateway, behind Keycloak SSO
  ingress:
    enabled: false

  # thanosService:
  #   enabled: true
  # thanosServiceMonitor:
  #   enabled: true

  prometheusSpec:
    replicas: 1
    # replicaExternalLabelName: __replica__

    enableRemoteWriteReceiver: true
    scrapeConfigSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    retention: 15d
    retentionSize: 18GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi



coreDns:
  enabled: true
  service:
    enabled: true
    port: 9153
    targetPort: 9153

    ipDualStack:
      enabled: false
      ipFamilies: ["IPv6", "IPv4"]
      ipFamilyPolicy: "PreferDualStack"
  serviceMonitor:
    enabled: true