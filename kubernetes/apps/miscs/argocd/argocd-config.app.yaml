apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io 
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/chxmxii/kubegoros.git
    path: kubernetes/apps/miscs/argocd/config
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true