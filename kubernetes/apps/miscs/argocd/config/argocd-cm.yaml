apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://argocd.lab.chxmxii.xyz
  kustomize.buildOptions: --enable-helm

  # SSO through Keycloak. The client secret comes from the argocd-oidc secret
  # (ExternalSecret below, labelled part-of=argocd so ArgoCD can read it).
  oidc.config: |
    name: Keycloak
    issuer: https://keycloak.lab.chxmxii.xyz/realms/kubegoros
    clientID: argocd
    cliClientID: argocd-cli
    cliClientID: argocd-cli
    clientSecret: $argocd-oidc:client-secret
    requestedScopes: ["openid", "profile", "email", "groups"]
    enablePKCEAuthentication: true
  # The local admin account stays as break-glass access; its password is random
  # (generated by ansible, see .secrets/argocd-admin-password).
  admin.enabled: "true"
  users.anonymous.enabled: "false"
  exec.enabled: "false"
  statusbadge.enabled: "false"

  # Let app-of-apps sync waves wait for child Applications to become Healthy.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs
