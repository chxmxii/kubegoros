loki:
  deploymentMode: Monolithic

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 30d
      allow_structured_metadata: true
      volume_enabled: true
    compactor:
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem
    pattern_ingester:
      enabled: true

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: longhorn
      size: 30Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi

  # Zero out the other deployment modes
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # memcached caches are overkill for a single-binary homelab install
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  minio:
    enabled: false

  lokiCanary:
    enabled: false

  test:
    enabled: false

  gateway:
    enabled: true

  monitoring:
    dashboards:
      enabled: true
      annotations:
        grafana_folder: Loki
    rules:
      enabled: true
    serviceMonitor:
      enabled: true
      metricRelabelings:
        - action: drop
          sourceLabels: ["__name__"]
          regex: loki_(request_duration|logql_querystats_bytes_processed_per)_seconds_bucket
