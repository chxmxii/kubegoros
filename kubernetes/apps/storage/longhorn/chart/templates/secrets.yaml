# S3 credentials for the backup target. Vault: secret/longhorn-backup with keys
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_ENDPOINTS (omit for AWS itself).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.backup.credentialSecret }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: {{ .Values.backup.credentialSecret }}
  dataFrom:
    - extract:
        key: longhorn-backup
---
# Passphrase for longhorn-crypto volumes. Vault: secret/longhorn-crypto, key "passphrase".
# Losing this passphrase means losing every encrypted volume (and its backups).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-crypto
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: longhorn-crypto
    template:
      data:
        CRYPTO_KEY_VALUE: "{{ `{{ .passphrase }}` }}"
        CRYPTO_KEY_PROVIDER: secret
        CRYPTO_KEY_CIPHER: aes-xts-plain64
        CRYPTO_KEY_HASH: sha256
        CRYPTO_KEY_SIZE: "256"
        CRYPTO_PBKDF: argon2i
  data:
    - secretKey: passphrase
      remoteRef:
        key: longhorn-crypto
        property: passphrase
