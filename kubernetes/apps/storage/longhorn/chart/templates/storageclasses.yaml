# Volumes on this class get snapshots but are never backed up off-cluster
# (recurring-job group "no-backup").
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-no-backups
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  dataLocality: best-effort
  recurringJobSelector: '[{"name":"no-backup", "isGroup":true}]'
---
# LUKS-encrypted volumes (dm-crypt on the node). The passphrase comes from Vault
# via the longhorn-crypto ExternalSecret. Use for anything holding credentials or PII.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-crypto
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  dataLocality: best-effort
  encrypted: "true"
  csi.storage.k8s.io/provisioner-secret-name: longhorn-crypto
  csi.storage.k8s.io/provisioner-secret-namespace: {{ .Release.Namespace }}
  csi.storage.k8s.io/node-publish-secret-name: longhorn-crypto
  csi.storage.k8s.io/node-publish-secret-namespace: {{ .Release.Namespace }}
  csi.storage.k8s.io/node-stage-secret-name: longhorn-crypto
  csi.storage.k8s.io/node-stage-secret-namespace: {{ .Release.Namespace }}
