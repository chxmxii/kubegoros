# The operator generates the bootstrap admin in the keycloak-initial-admin secret:
#   kubectl -n keycloak get secret keycloak-initial-admin -o jsonpath='{.data.password}' | base64 -d
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db-rw
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  hostname:
    hostname: https://keycloak.k8s.coralio.co
  # TLS terminates at ingress-nginx; Keycloak serves plain HTTP inside the cluster
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: true
    className: nginx
    tlsSecret: keycloak-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 2Gi
