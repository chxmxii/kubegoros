# All OIDC client secrets live in Vault at secret/keycloak-clients (see hack/vault-seed.sh).
# The realm import below reads them through placeholders; each app reads its own key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-clients
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: keycloak-clients
  dataFrom:
    - extract:
        key: keycloak-clients
