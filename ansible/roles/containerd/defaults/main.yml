---
# defaults file for containerd

# Packages options. Kubernetes >= 1.36 requires containerd 2.x (containerd.io >= 2.0).
containerd_package_name: containerd.io
containerd_package_state: present

# Service Options
containerd_service_state: started
containerd_service_enabled: true

# Write a default containerd config.toml file.
containerd_config_default_write: true

# Set systemd as cgroup driver in config.toml / Only use with containerd_config_default_write: true
# Must match the kubelet cgroupDriver (systemd, see roles/kubeadm).
containerd_config_cgroup_driver_systemd: true

# Docker CE repository (provides containerd.io)
docker_yum_base_url: "https://download.docker.com/linux/{{ (ansible_distribution == 'Fedora') | ternary('fedora', 'rhel') }}/$releasever/$basearch/stable"
docker_yum_gpg_key: "https://download.docker.com/linux/{{ (ansible_distribution == 'Fedora') | ternary('fedora', 'rhel') }}/gpg"
