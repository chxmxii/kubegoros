---
# tasks for argocd app-of-apps bootstrapping
- name: Initialize ArgoCD bootstrap process
  block:
    - name: Prepare ArgoCD bootstrap directory
      ansible.builtin.file:
        path: /tmp/argocd/bootstrap
        state: directory
        mode: "0700"

    - name: Deploy ArgoCD application manifests
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0600"
      loop:
        - { src: 'root.yaml.j2', dest: '/tmp/argocd/bootstrap/root.yaml' }
        - { src: 'projects.yaml.j2', dest: '/tmp/argocd/bootstrap/projects.yaml' }

    - name: Deploy ArgoCD private repository credentials
      ansible.builtin.template:
        src: repo.yaml.j2
        dest: /tmp/argocd/bootstrap/repo.yaml
        mode: "0600"
      when: git_repo is defined and git_repo.username is defined
      no_log: true

    - name: Apply ArgoCD bootstrap configuration
      kubernetes.core.k8s:
        state: present
        src: "/tmp/argocd/bootstrap/{{ item }}"
        apply: true
      loop: "{{ ['root.yaml', 'projects.yaml'] + (['repo.yaml'] if (git_repo is defined and git_repo.username is defined) else []) }}"

  always:
    - name: Clean bootstrap directory
      ansible.builtin.file:
        path: /tmp/argocd
        state: absent
