---
# tasks file for gitops
- name: Configure and deploy ArgoCD
  when: inventory_hostname == kube_admin_node
  block:
    - name: Install Helm
      ansible.builtin.include_tasks: 00-install_helm.yml

    - name: Install Kustomize
      ansible.builtin.include_tasks: 01-install_kustomize.yml

    - name: Install ArgoCD
      ansible.builtin.include_tasks: 02-install_argocd.yml

    - name: Configure ArgoCD
      ansible.builtin.include_tasks: 03-configure_argocd.yml

    - name: Bootstrap ArgoCD
      ansible.builtin.include_tasks: 04-bootstrap_argocd.yml
