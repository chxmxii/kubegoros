---
- name: Get the installed Helm version
  ansible.builtin.command: "{{ helm_binary_path }} version --short"
  changed_when: false
  failed_when: false
  register: existing_helm_version

- name: Install Helm
  when: existing_helm_version.rc != 0 or ('v' ~ helm_version) not in existing_helm_version.stdout
  block:
    - name: Download Helm
      ansible.builtin.get_url:
        url: "{{ helm_url }}"
        dest: "/tmp/{{ helm_archive }}"
        checksum: "{{ helm_checksum }}"
        mode: "0644"

    - name: Extract Helm
      ansible.builtin.unarchive:
        remote_src: true
        src: "/tmp/{{ helm_archive }}"
        dest: "{{ helm_path }}"
        include:
          - "{{ os_platform }}-{{ system_arch }}/helm"
        extra_opts:
          - --strip-components=1
        owner: root
        group: root
        mode: "0755"
  always:
    - name: Remove the Helm archive
      ansible.builtin.file:
        path: "/tmp/{{ helm_archive }}"
        state: absent
