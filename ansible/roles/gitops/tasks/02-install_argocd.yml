---
- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ argocd_namespace }}"
    state: present

- name: Check whether ArgoCD is already installed
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
  register: argocd_server_deployment

# Only the first install is done here; afterwards ArgoCD is upgraded deliberately (not by re-running bootstrap)
- name: Install ArgoCD
  when: argocd_server_deployment.resources | length == 0
  block:
    - name: Download the ArgoCD manifest
      ansible.builtin.get_url:
        url: "{{ argocd_manifests }}"
        dest: /tmp/argocd.yml
        owner: root
        group: root
        mode: "0600"

    # ArgoCD 3.x CRDs exceed the client-side apply annotation limit
    - name: Deploy ArgoCD
      kubernetes.core.k8s:
        namespace: "{{ argocd_namespace }}"
        state: present
        src: /tmp/argocd.yml
        apply: true
        server_side_apply:
          field_manager: ansible
          force_conflicts: true
  always:
    - name: Clean installation manifest
      ansible.builtin.file:
        path: /tmp/argocd.yml
        state: absent

- name: Install ArgoCD command line tool
  ansible.builtin.get_url:
    url: "{{ argocd_cli_url }}"
    dest: "{{ argocd_binary_path }}/argocd"
    checksum: "{{ argocd_cli_checksum }}"
    owner: root
    group: root
    mode: "0755"

- name: Wait for ArgoCD to be available
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 600
