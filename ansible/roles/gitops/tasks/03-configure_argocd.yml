---
# Sets the admin password to a random value stored in .secrets/argocd-admin-password on the
# ansible controller. A sha256 annotation makes this idempotent (bcrypt hashes are salted).
- name: Read the current admin password marker
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: argocd-secret
    namespace: "{{ argocd_namespace }}"
  register: argocd_secret

- name: Set the ArgoCD admin password
  when: >-
    (argocd_secret.resources[0].metadata.annotations | default({})).get('kubegoros/admin-password-sha256')
    != (argocd_admin_password | hash('sha256'))
  block:
    - name: Hash the admin password
      ansible.builtin.command:
        argv:
          - "{{ argocd_binary_path }}/argocd"
          - account
          - bcrypt
          - --password
          - "{{ argocd_admin_password }}"
      register: argocd_admin_bcrypt
      changed_when: false
      no_log: true

    - name: Patch argocd-secret with the new admin password
      kubernetes.core.k8s:
        state: patched
        kind: Secret
        name: argocd-secret
        namespace: "{{ argocd_namespace }}"
        definition:
          metadata:
            annotations:
              kubegoros/admin-password-sha256: "{{ argocd_admin_password | hash('sha256') }}"
          stringData:
            admin.password: "{{ argocd_admin_bcrypt.stdout }}"
            admin.passwordMtime: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
      no_log: true

- name: Remove the initial admin secret
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: argocd-initial-admin-secret
    namespace: "{{ argocd_namespace }}"

- name: Show where the admin password is stored
  ansible.builtin.debug:
    msg: "ArgoCD admin password: {{ argocd_admin_password_file | realpath }} (on the ansible controller)"
