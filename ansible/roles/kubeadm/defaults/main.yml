# defaults file for kubeadm
---

# renovate: datasource=github-releases depName=kubernetes/kubernetes
kube_version_kubeadm: "1.37.1"

kubelet_config_root_dir: "/etc/kubernetes"

kube_apiserver_advertise_address: ""

kube_cluster_extlb: "{{ vip_address }}"  

# Cilium is installed from the same wrapper chart ArgoCD later adopts (kubernetes/apps/networking/cilium/chart)
kube_cni_cilium_chart: "{{ playbook_dir }}/../../kubernetes/apps/networking/cilium/chart"
# Monitoring CRDs don't exist yet at bootstrap; ArgoCD turns these back on.
kube_cni_cilium_bootstrap_overrides:
  - cilium.prometheus.serviceMonitor.enabled=false
  - cilium.operator.prometheus.serviceMonitor.enabled=false
  - cilium.hubble.metrics.serviceMonitor.enabled=false
  - cilium.hubble.relay.prometheus.serviceMonitor.enabled=false
  - cilium.hubble.ui.ingress.enabled=false

kube_cluster_node_name: "{{ inventory_hostname }}"

kube_cluster_initial_controlplane: false
#-------------------------
# kubeadm j2 template
#-------------------------
kube_cfg_init_conf:
  # Cilium runs with kubeProxyReplacement, so kube-proxy is never deployed
  skipPhases:
    - addon/kube-proxy
  nodeRegistration:
    name: "{{ kube_cluster_node_name }}"
  localAPIEndpoint:
    advertiseAddress: "{{ kube_apiserver_advertise_address | default(ansible_default_ipv4['address'], true) }}"
    bindPort: 6443

kube_cfg_cluster_conf:
  networking:
    podSubnet: 10.244.0.0/16
    serviceSubnet: 10.96.0.0/16
    dnsDomain: cluster.local
  kubernetesVersion: "{{ kube_version_kubeadm }}"
  controlPlaneEndpoint: "{{ kube_cluster_extlb | default(hostvars[inventory_hostname]['ansible_facts']['default_ipv4']['address']) }}:6443"
  controllerManager:
    extraArgs:
      - name: bind-address
        value: "0.0.0.0"
  scheduler:
    extraArgs:
      - name: bind-address
        value: "0.0.0.0"

kube_cfg_join_conf:
  nodeRegistration:
    name: "{{ kube_cluster_node_name }}"
  discovery:
    bootstrapToken:
      token: "{{ kube_cluster_join_token }}"  
      apiServerEndpoint: "{{ kube_cluster_api_server_ip }}:{{ kube_cfg_init_conf.localAPIEndpoint.bindPort }}"
      caCertHashes:
        - "sha256:{{ kube_cluster_root_ca_hash }}"
      unsafeSkipCAVerification: false

kube_cfg_kubelet_conf:
  cgroupDriver: "systemd"
  failSwapOn: false
