---
# tasks file for kubeadm
- name: Ensure kubelet is enabled at boot
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true

- name: Configure controlplane nodes
  ansible.builtin.include_tasks: 01-k8s_masters_config.yml
  when: kube_cluster_node_type == 'master'

- name: Join workers
  ansible.builtin.include_tasks: 04-k8s_join_node.yml
  when: kube_cluster_node_type == 'worker'

- name: Label kubernetes worker nodes
  ansible.builtin.command: >
    kubectl --kubeconfig {{ kubelet_config_root_dir }}/admin.conf
    label node {{ kube_cluster_node_name }} node-role.kubernetes.io/worker= --overwrite
  register: kube_label_result
  changed_when: "'not labeled' not in kube_label_result.stdout"
  delegate_to: "{{ kube_admin_node }}"
  when: kube_cluster_node_name in groups['kube_workernodes']
