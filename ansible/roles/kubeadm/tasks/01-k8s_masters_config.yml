---
# tasks for 01-k8s_masters_config.yml
- name: Initialize cluster on main control-plane
  ansible.builtin.include_tasks: 02-k8s_init_controlplane.yml
  when: inventory_hostname == kube_admin_node

- name: Prepare environment for the cluster
  ansible.builtin.include_tasks: 00-setup_facts.yml
  when: inventory_hostname == kube_admin_node

- name: Join other controlplanes
  ansible.builtin.include_tasks: 03-k8s_join_controlplane.yml
  when: inventory_hostname != kube_admin_node
