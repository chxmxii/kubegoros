---
- name: Create control plane configuration and certs directory
  ansible.builtin.file:
    path: "{{ kubelet_config_root_dir }}/pki/etcd"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write control plane configuration and certs
  ansible.builtin.copy:
    dest: "{{ item.item.item }}"
    content: "{{ item.content | b64decode }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ kube_cluster_control_plane_files.results | selectattr('content', 'defined') }}"
  loop_control:
    label: "{{ item.item.item }}"
  no_log: true

- name: Write control plane security configuration
  ansible.builtin.include_tasks: 05-controlplane_security.yml

- name: Join control-plane node
  ansible.builtin.include_tasks: 04-k8s_join_node.yml

- name: Ensure .kube directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: "0700"

- name: Create symbolic link for admin.conf
  ansible.builtin.file:
    src: "{{ kubelet_config_root_dir }}/admin.conf"
    dest: "{{ ansible_env.HOME }}/.kube/config"
    state: link
