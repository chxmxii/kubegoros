---
- name: Create a join token
  ansible.builtin.command: kubeadm token create --ttl 1h
  register: kube_join_cmd_result
  changed_when: true
  no_log: true

- name: Share the join token with the other nodes
  ansible.builtin.set_fact:
    kube_cluster_join_token: "{{ kube_join_cmd_result.stdout }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ ansible_play_hosts }}"
  no_log: true

- name: Get root CA certificate hash
  ansible.builtin.shell: |
    set -o pipefail
    openssl x509 -pubkey -in {{ kubelet_config_root_dir }}/pki/ca.crt \
      | openssl rsa -pubin -outform der 2>/dev/null \
      | openssl dgst -sha256 -hex \
      | sed 's/^.* //'
  args:
    executable: /usr/bin/bash
  register: get_root_ca_command_result
  changed_when: false

- name: Share cluster facts with the other nodes
  ansible.builtin.set_fact:
    kube_cluster_root_ca_hash: "{{ get_root_ca_command_result.stdout }}"
    kube_cluster_api_server_ip: "{{ ansible_default_ipv4['address'] }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ ansible_play_hosts }}"

# Stacked etcd: the shared CA, service-account and front-proxy keys must be identical on every control plane
- name: Check which control plane certificate files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: certificate_files
  loop:
    - /etc/kubernetes/pki/ca.crt
    - /etc/kubernetes/pki/ca.key
    - /etc/kubernetes/pki/sa.key
    - /etc/kubernetes/pki/sa.pub
    - /etc/kubernetes/pki/front-proxy-ca.crt
    - /etc/kubernetes/pki/front-proxy-ca.key
    - /etc/kubernetes/pki/etcd/ca.crt
    - /etc/kubernetes/pki/etcd/ca.key
    - /etc/kubernetes/admin.conf

- name: Gather control plane configurations and certs
  ansible.builtin.slurp:
    src: "{{ item.item }}"
  register: control_plane_files
  when: item.stat.exists | bool
  loop: "{{ certificate_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Share control plane files with the other control planes
  ansible.builtin.set_fact:
    kube_cluster_control_plane_files: "{{ control_plane_files }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['kube_controlplanes'] | intersect(ansible_play_hosts) }}"
  no_log: true
