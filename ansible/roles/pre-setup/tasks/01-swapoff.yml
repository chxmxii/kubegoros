---
- name: Ensure swap entries are removed from /etc/fstab
  ansible.posix.mount:
    name: swap
    fstype: swap
    state: absent

- name: Check for active swap
  ansible.builtin.command: swapon --show --noheadings
  register: swap_active
  changed_when: false

- name: Ensure swap is turned off
  ansible.builtin.command: swapoff -a
  when: swap_active.stdout | length > 0
  changed_when: true

- name: Ensure the zram swap generator is absent
  ansible.builtin.dnf:
    name: zram-generator-defaults
    state: absent

- name: Ensure the swap.target unit is masked
  ansible.builtin.systemd_service:
    name: swap.target
    masked: true
