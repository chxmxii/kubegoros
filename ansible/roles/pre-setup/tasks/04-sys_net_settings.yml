---
- name: Ensure the hostname is set
  ansible.builtin.hostname:
    name: "{{ node_hostname }}"

- name: Ensure /etc/hosts is updated
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Ensure firewalld is disabled
  ansible.builtin.systemd_service:
    name: firewalld
    state: stopped
    enabled: false
  when:
    - firewall_isdisabled | bool
    - "'firewalld.service' in ansible_facts.services"

- name: Ensure the SELinux state is applied
  ansible.posix.selinux:
    policy: targeted
    state: "{{ selinux_state }}"
  register: selinux_result

- name: Warn when SELinux needs a reboot
  ansible.builtin.debug:
    msg: "SELinux state change on {{ inventory_hostname }} requires a reboot to take full effect."
  when: selinux_result.reboot_required | default(false)

- name: Ensure kernel modules are loaded and persisted
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ kernel_modules }}"

- name: Ensure kernel parameters are set
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ kernel_sysctls | dict2items }}"
