---
# tasks file for pre-setup
- name: Ensure resource requirements
  ansible.builtin.include_tasks: 00-res_assert.yml

- name: Ensure swap is turned off
  ansible.builtin.include_tasks: 01-swapoff.yml

- name: Ensure Kubernetes repo is added
  ansible.builtin.include_tasks: 02-setup_repos.yml

- name: Ensure the needed packages are installed
  ansible.builtin.include_tasks: 03-install_packages.yml

- name: Ensure system and network configurations are applied
  ansible.builtin.include_tasks: 04-sys_net_settings.yml

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
