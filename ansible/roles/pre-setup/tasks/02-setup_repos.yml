---
- name: Ensure the EPEL repository is enabled
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Ensure the Kubernetes GPG key is imported
  ansible.builtin.rpm_key:
    key: "{{ kubernetes_yum_gpg_key }}"
    state: present

- name: Ensure the Kubernetes repository is configured
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes Repository
    enabled: true
    gpgcheck: true
    repo_gpgcheck: true
    baseurl: "{{ kubernetes_yum_base_url }}"
    gpgkey: "{{ kubernetes_yum_gpg_key }}"
    exclude: "{{ kubernetes_yum_exclude }}"
    mode: "0644"
