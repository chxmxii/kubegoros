---
# Applies audit logging, encryption at rest, OIDC structured authentication and
# profiling/TLS hardening to an EXISTING cluster (>= 1.34), one control plane at a time.
# New clusters get the same settings from roles/kubeadm at `task cluster:init`.
- name: Bootstrap
  ansible.builtin.import_playbook: bootstrap.yml

- name: Harden control plane nodes
  hosts: kube_controlplanes
  become: true
  serial: 1
  vars_files:
    - vars/main.yml
  tasks:
    - name: Harden this control plane
      ansible.builtin.include_role:
        name: kubeadm
        tasks_from: 06-harden_controlplane.yml

- name: Encrypt existing secrets
  hosts: kube_controlplanes[0]
  become: true
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
  tasks:
    - name: Rewrite every secret so it is stored encrypted
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig {{ kubeconfig }} get secrets -A -o json \
          | kubectl --kubeconfig {{ kubeconfig }} replace -f -
      args:
        executable: /usr/bin/bash
      changed_when: true

    - name: Create a canary secret
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig {{ kubeconfig }} -n kube-system create secret generic encryption-canary \
          --from-literal=check=ok --dry-run=client -o yaml | kubectl --kubeconfig {{ kubeconfig }} apply -f -
      args:
        executable: /usr/bin/bash
      changed_when: false

    - name: Verify the canary is encrypted in etcd
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig {{ kubeconfig }} -n kube-system exec etcd-{{ inventory_hostname }} -- etcdctl \
          --cacert /etc/kubernetes/pki/etcd/ca.crt \
          --cert /etc/kubernetes/pki/etcd/server.crt \
          --key /etc/kubernetes/pki/etcd/server.key \
          get /registry/secrets/kube-system/encryption-canary | grep -c 'k8s:enc:secretbox:v1'
      args:
        executable: /usr/bin/bash
      register: encryption_check
      changed_when: false
      failed_when: encryption_check.stdout | int < 1
