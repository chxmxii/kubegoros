---
- name: Ensure the node meets the requirements of the target version
  ansible.builtin.include_role:
    name: pre-setup
    tasks_from: 00-res_assert.yml

- name: Point the Kubernetes repository at the target minor version
  ansible.builtin.include_role:
    name: pre-setup
    tasks_from: 02-setup_repos.yml

- name: Upgrade kubeadm
  ansible.builtin.dnf:
    name: kubeadm
    state: latest # noqa package-latest
    update_cache: true
    disable_excludes: kubernetes

- name: Get the target kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_target
  changed_when: false

- name: Upgrade the control plane (initial control plane)
  ansible.builtin.command: kubeadm upgrade apply {{ kubeadm_target.stdout }} --yes
  changed_when: true
  when: inventory_hostname == kube_admin_node

- name: Upgrade the node configuration
  ansible.builtin.command: kubeadm upgrade node
  changed_when: true
  when: inventory_hostname != kube_admin_node

- name: Drain node
  ansible.builtin.command: >
    kubectl --kubeconfig /etc/kubernetes/admin.conf drain {{ inventory_hostname }}
    --ignore-daemonsets --delete-emptydir-data --timeout=15m
  changed_when: true
  delegate_to: "{{ kube_admin_node }}"

- name: Upgrade containerd (Kubernetes >= 1.36 requires containerd 2.x)
  ansible.builtin.include_role:
    name: containerd
  vars:
    containerd_package_state: latest

- name: Upgrade kubelet and kubectl
  ansible.builtin.dnf:
    name:
      - kubelet
      - kubectl
    state: latest # noqa package-latest
    disable_excludes: kubernetes

- name: Restart kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
    daemon_reload: true

- name: Wait for the node to report the new version and become Ready
  ansible.builtin.command: >
    kubectl --kubeconfig /etc/kubernetes/admin.conf get node {{ inventory_hostname }}
    -o jsonpath='{.status.nodeInfo.kubeletVersion} {.status.conditions[?(@.type=="Ready")].status}'
  register: node_status
  changed_when: false
  delegate_to: "{{ kube_admin_node }}"
  retries: 60
  delay: 10
  until: node_status.stdout == kubeadm_target.stdout ~ ' True'

- name: Uncordon node
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf uncordon {{ inventory_hostname }}
  changed_when: true
  delegate_to: "{{ kube_admin_node }}"
