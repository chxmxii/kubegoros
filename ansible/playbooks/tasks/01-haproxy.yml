---
# tasks for the HAProxy + keepalived API server load balancers
- name: Ensure the hostname is set
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Ensure /etc/hosts is updated
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

- name: Ensure non local IP binding is enabled
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_file: /etc/sysctl.d/90-haproxy.conf
    state: present
    reload: true

- name: Install HAProxy and keepalived packages
  ansible.builtin.dnf:
    name:
      - haproxy
      - keepalived
      - psmisc
      - dnf-plugins-core
    state: present

- name: Install HAProxy with the Prometheus exporter
  when: haproxy_metrics_isenabled | bool
  block:
    - name: Check the installed HAProxy build
      ansible.builtin.command: /usr/sbin/haproxy -vv
      register: haproxy_build
      changed_when: false
      failed_when: false

    - name: Build HAProxy from source
      when: >-
        ('HA-Proxy version ' ~ haproxy_version) not in haproxy_build.stdout
        or 'prometheus-exporter' not in haproxy_build.stdout
      block:
        - name: Enable the repository providing lua-devel (PowerTools on EL8, CRB on EL9)
          ansible.builtin.command: >
            dnf config-manager --set-enabled {{ 'powertools' if ansible_distribution_major_version == '8' else 'crb' }}
          changed_when: true

        - name: Install build dependencies
          ansible.builtin.dnf:
            name:
              - gcc
              - make
              - openssl-devel
              - pcre2-devel
              - zlib-devel
              - lua-devel
              - systemd-devel
            state: present

        - name: Download the HAProxy source
          ansible.builtin.get_url:
            url: "https://www.haproxy.org/download/{{ haproxy_version.split('.')[:2] | join('.') }}/src/haproxy-{{ haproxy_version }}.tar.gz"
            dest: /tmp/haproxy-{{ haproxy_version }}.tar.gz
            checksum: "{{ haproxy_checksum }}"
            mode: "0644"

        - name: Extract the HAProxy source
          ansible.builtin.unarchive:
            remote_src: true
            src: /tmp/haproxy-{{ haproxy_version }}.tar.gz
            dest: /tmp/

        - name: Compile HAProxy with Lua, OpenSSL and the Prometheus exporter
          community.general.make:
            chdir: /tmp/haproxy-{{ haproxy_version }}
            params:
              TARGET: linux-glibc
              USE_LUA: 1
              USE_OPENSSL: 1
              USE_PCRE2: 1
              USE_ZLIB: 1
              USE_SYSTEMD: 1
              USE_PROMEX: 1

        - name: Install the HAProxy binary
          ansible.builtin.copy:
            remote_src: true
            src: /tmp/haproxy-{{ haproxy_version }}/haproxy
            dest: /usr/sbin/haproxy
            owner: root
            group: root
            mode: "0755"
          notify: Restart haproxy
      always:
        - name: Clean up the HAProxy build
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/haproxy-{{ haproxy_version }}
            - /tmp/haproxy-{{ haproxy_version }}.tar.gz

- name: Deploy HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/haproxy -c -f %s
  notify: Restart haproxy

- name: Deploy keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart keepalived

- name: Deploy keepalived health check script
  ansible.builtin.template:
    src: heartbeat.sh.j2
    dest: /etc/keepalived/heartbeat.sh
    owner: root
    group: root
    mode: "0750"

- name: Start and enable HAProxy and keepalived
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - haproxy
    - keepalived

- name: Install the keepalived metrics exporter
  ansible.builtin.include_tasks: 02-install_kame.yml
  when: keepalived_metrics_isenabled | bool
