---
# DESTRUCTIVE: wipes Kubernetes from every node in kube_cluster.
- name: Bootstrap
  ansible.builtin.import_playbook: bootstrap.yml

- name: Reset Kubernetes cluster
  hosts: kube_cluster
  become: true
  vars_prompt:
    - name: confirm_reset
      prompt: "This destroys the cluster on all nodes. Type 'yes' to continue"
      private: false
  tasks:
    - name: Abort unless confirmed
      ansible.builtin.assert:
        that: confirm_reset == 'yes'
        quiet: true

    - name: Reset kubeadm
      ansible.builtin.command: kubeadm reset --force
      changed_when: true

    - name: Remove CNI, kubeconfig and control plane leftovers
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /var/lib/cni
        - /run/cilium
        - /etc/kubernetes
        - /var/log/kubernetes
        - /root/.kube

    - name: Remove Cilium network interfaces
      ansible.builtin.command: ip link delete {{ item }}
      loop: [cilium_host, cilium_net, cilium_vxlan]
      register: link_delete
      failed_when: false
      changed_when: link_delete.rc == 0

    - name: Flush Kubernetes and Cilium iptables rules
      ansible.builtin.shell: |
        set -o pipefail
        iptables-save | grep -v -E 'KUBE|CILIUM' | iptables-restore
      args:
        executable: /usr/bin/bash
      changed_when: true
