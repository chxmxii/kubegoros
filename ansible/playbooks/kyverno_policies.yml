---
- name: Configure Kyverno policies
  hosts: kube_controlplanes[0]
  become: true
  vars:
    kyverno_policies_enabled: true
    kyverno_policies:
      - deny-privilege-escalation.yaml
      - disallow-privileged-containers.yaml
      - require-resource-requests.yaml
  tasks:
    - name: Deploy Kyverno policies
      kubernetes.core.k8s:
        state: "{{ 'present' if kyverno_policies_enabled | bool else 'absent' }}"
        definition: "{{ lookup('ansible.builtin.file', 'files/policies/' ~ item) | from_yaml }}"
      loop: "{{ kyverno_policies }}"
