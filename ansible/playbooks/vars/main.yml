---
# @vars for haproxy and keepalived
vip_address: 10.254.100.99

# HAProxy is built from the pinned LTS source tarball with the Prometheus exporter (USE_PROMEX)
haproxy_metrics_isenabled: true
haproxy_version: 3.2.26
haproxy_checksum: sha256:760ef35fafc1e05844e73ad07e138e9e96fddbf5de02f606249c027f754827da

# VRRP PASS auth is limited to 8 characters; generated on the controller (.secrets/ is gitignored)
keepalived_auth_pass_file: "{{ playbook_dir }}/../../.secrets/keepalived-auth-pass"
keepalived_auth_pass: "{{ lookup('ansible.builtin.password', keepalived_auth_pass_file ~ ' length=8 chars=ascii_letters,digits') }}"
keepalived_virtual_router_id: 51

keepalived_metrics_isenabled: true
kame_version: 1.3.3
sys_arch: '{{ ''amd64'' if ansible_architecture == ''x86_64'' else ''arm64'' }}'
kame_archive_path: "/tmp/keepalived_exporter-{{ kame_version }}.linux-{{ sys_arch }}"
kame_release: "https://github.com/mehdy/keepalived-exporter/releases/download/v{{ kame_version }}"
kame_url: "{{ kame_release }}/keepalived-exporter-{{ kame_version }}.linux-{{ sys_arch }}.tar.gz"


# @vars for firewalld config
# Bare numbers are TCP; use "<port>/udp" for UDP.
# Cilium: 4240 health, 4244 hubble server, 8472/udp VXLAN.
controlplane_firewall_ports:
  - 10248
  - 4240
  - 4244
  - 8472/udp
  - 2379
  - 2380
  - 10250
  - 6443
  - 10257
  - 10259

workernode_firewall_ports:
  - 10250
  - 4240
  - 4244
  - 8472/udp
  - '30000-32767'

firewall_services:
  - http
  - https
