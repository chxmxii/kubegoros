[defaults]
remote_user = ansible
roles_path = ansible/roles
inventory = inventory.yml
# Verify SSH host keys (after re-provisioning a node: ssh-keygen -R <host>)
host_key_checking = True
deprecation_warnings = False
# Overridden per host by ansible/playbooks/group_vars/all.yml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
