version: '3'

vars:
  ANSIBLE_INVENTORY: "inventory.yml"

tasks:
  check:
    silent: true
    cmds:
      - echo "Checking host connectivity..." && ansible all -m ping
    preconditions:
      - {msg: "Missing Ansible Inventory file", sh: "test -f {{.ANSIBLE_INVENTORY}}" }

  list:
    silent: true
    cmds:
      - echo "Listing all the hosts..." && ansible-inventory --graph
    preconditions:
      - {msg: "Missing Ansible Inventory file", sh: "test -f {{.ANSIBLE_INVENTORY}}" }

  reboot:
    silent: true
    cmds:
      - echo "Rebooting all the nodes..." && ansible all -a 'systemctl reboot' -b
    preconditions:
      - {msg: "Missing Ansible Inventory file", sh: "test -f {{.ANSIBLE_INVENTORY}}" }
